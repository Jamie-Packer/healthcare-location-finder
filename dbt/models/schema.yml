version: 2

models:
  - name: location
    columns:
      - name: location_id
        data_tests: [unique, not_null]
      - name: name
        data_tests: [not_null]
      - name: match_string
        data_tests: [not_null]
      - name: country_name
        data_tests:
          - accepted_values:
              arguments:
                values: ["England"]
      - name: service_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["hospital", "care home", "gp", "other"]
  - name: stg_cqc_deactivated
    columns:
      - name: cqc_location_id
        data_tests: [not_null]
  - name: search_entity
    columns:
      - name: entity_id
        data_tests: [unique, not_null]
  - name: entity_site
    columns:
      - name: entity_id
        data_tests: [not_null]
      - name: location_id
        data_tests: [not_null]
