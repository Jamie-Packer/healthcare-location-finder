<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    background: #1b1916;
    color: #ece6da;
  }
  .mermaid {
    display: flex;
    justify-content: center;
  }
  .mermaid svg {
    max-width: 100%;
    height: auto;
  }
</style>
</head>
<body>
<pre class="mermaid">
erDiagram
    ORGANISATION ||--o{ SITE : "runs"
    SITE }o--|| SERVICE_TYPE : "hospital, care home, GP, home care, or other"
    SITE }o--|| POSTCODE : "is at"
    POSTCODE }o--|| PLACE : "country, local authority, health area"
</pre>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: false,
    theme: "dark",
    themeVariables: {
      darkMode: true,
      background: "#1b1916",
      primaryColor: "#25221e",
      primaryTextColor: "#ece6da",
      primaryBorderColor: "#d4a24c",
      lineColor: "#b9b1a2",
      secondaryColor: "#211e1a",
      tertiaryColor: "#1b1916",
      fontFamily: "Inter, system-ui, sans-serif"
    }
  });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
</body>
</html>
