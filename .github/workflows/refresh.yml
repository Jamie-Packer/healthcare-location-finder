name: Refresh location data

# 04:00 UTC on Monday is 04:00 GMT, and 05:00 during British Summer Time.
# GitHub pauses a schedule after 60 days without repository activity, such as
# a commit, issue, or pull request. This workflow updates the release notes on
# every check, and opens an issue when a check fails.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if sources match or the row count moves outside the usual band
        type: boolean
        default: false
      reset_history:
        description: Allow rebuilding without restoring the previous snapshot history
        type: boolean
        default: false

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      action: ${{ steps.refresh.outputs.action }}
      degraded: ${{ steps.refresh.outputs.degraded }}
      stale: ${{ steps.refresh.outputs.stale }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Refresh
        id: refresh
        env:
          FORCE_REFRESH: ${{ inputs.force && 'true' || 'false' }}
          RESET_HISTORY: ${{ inputs.reset_history && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m ingest.refresh
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/build/refresh-status.json").read_text(encoding="utf-8"))
          Path("data/build/action.txt").write_text(status["action"], encoding="utf-8")
          Path("data/build/degraded.txt").write_text("true" if status.get("degraded") else "false", encoding="utf-8")
          Path("data/build/stale.txt").write_text(", ".join(status.get("stale") or []), encoding="utf-8")
          PY
          echo "action=$(cat data/build/action.txt)" >> "$GITHUB_OUTPUT"
          echo "degraded=$(cat data/build/degraded.txt)" >> "$GITHUB_OUTPUT"
          echo "stale=$(cat data/build/stale.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload the validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-report
          path: data/build/validation-report.json
          if-no-files-found: ignore

      - name: Upload verified release assets
        if: steps.refresh.outputs.action == 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          retention-days: 1
          path: |
            release.json
            data/build/release-notes.txt
            data/build/build_id.txt
            data/mart/location.parquet
            data/mart/search_entity.parquet
            data/mart/entity_site.parquet
            data/mart/entity_alias.parquet
            data/mart/entity_identifier.parquet
            data/mart/location_history.parquet
            data/mart/manifest.json
            data/mart/source-cache.zip
            data/mart/location-reference-bundle.zip
            data/mart/location-reference-bundle.zip.sha256

  publish:
    needs: build
    if: needs.build.outputs.action == 'publish' || needs.build.outputs.action == 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        if: needs.build.outputs.action == 'skip'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified release assets
        if: needs.build.outputs.action == 'publish'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle

      - name: Publish immutable release then update latest
        if: needs.build.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job downloads the release bundle without checking out .git,
          # so gh needs the repository explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["tag"])')
          notes=$(python3 -c 'from pathlib import Path; print(Path("data/build/release-notes.txt").read_text(encoding="utf-8").strip())')
          build_id=$(python3 -c 'from pathlib import Path; print(Path("data/build/build_id.txt").read_text(encoding="utf-8").strip())')
          immutable="data-${build_id}"
          assets=(
            data/mart/location.parquet
            data/mart/search_entity.parquet
            data/mart/entity_site.parquet
            data/mart/entity_alias.parquet
            data/mart/entity_identifier.parquet
            data/mart/location_history.parquet
            data/mart/manifest.json
            data/mart/source-cache.zip
            data/mart/location-reference-bundle.zip
            data/mart/location-reference-bundle.zip.sha256
          )
          # 1. Stage the immutable release as a draft, upload and verify all assets, then publish it.
          is_draft=""
          if gh release view "$immutable" >/dev/null 2>&1; then
            is_draft=$(gh release view "$immutable" --json isDraft --jq '.isDraft')
          fi
          if [ -z "$is_draft" ]; then
            gh release create "$immutable" --draft --title "Location reference ${build_id}" --notes "$notes"
            gh release upload "$immutable" "${assets[@]}" --clobber
          elif [ "$is_draft" = "true" ]; then
            gh release edit "$immutable" --title "Location reference ${build_id}" --notes "$notes"
            gh release upload "$immutable" "${assets[@]}" --clobber
          else
            echo "Published release ${immutable} already exists and is left unchanged."
          fi
          if [ "$is_draft" != "false" ]; then
            asset_json=$(gh release view "$immutable" --json assets)
            ASSET_JSON="$asset_json" python3 - "${assets[@]}" <<'PY'
          import json, os, sys
          from pathlib import Path
          expected = {Path(p).name: Path(p).stat().st_size for p in sys.argv[1:]}
          uploaded = {item["name"]: item["size"] for item in json.loads(os.environ["ASSET_JSON"])["assets"]}
          missing = [name for name, size in expected.items() if uploaded.get(name) != size]
          if missing:
              raise SystemExit(f"Draft release asset verification failed for: {', '.join(missing)}")
          PY
            gh release edit "$immutable" --draft=false
          fi
          # 2. Update the mutable latest tag only after the immutable release is verified and published.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Location data" --notes "$notes"
          else
            gh release edit "$tag" --notes "$notes"
          fi
          gh release upload "$tag" "${assets[@]}" --clobber

      - name: Record an unchanged check
        if: needs.build.outputs.action == 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(python3 -c 'import json; print(json.load(open("release.json", encoding="utf-8"))["tag"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "Checked $(date -u +%Y-%m-%dT%H:%M:%SZ). Sources unchanged. The previous location files stay published."
          fi

  report:
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Update failure issue status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const buildResult = "${{ needs.build.result }}";
            const publishResult = "${{ needs.publish.result }}";
            const degraded = "${{ needs.build.outputs.degraded }}" === "true";
            const stale = "${{ needs.build.outputs.stale }}";
            const title = "Data refresh failed";
            const failedBuild = buildResult !== "success";
            const failedPublish = publishResult === "failure";
            const shouldAlert = failedBuild || failedPublish || degraded;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (shouldAlert) {
              let summary;
              if (failedBuild) {
                summary = "The location refresh failed before publication. The previous release is unchanged.";
              } else if (failedPublish) {
                summary = "The location refresh passed validation, but release publication failed partway through. Inspect the latest release assets before promoting.";
              } else {
                summary = "New location files were published, but some sources used their last good copy: " + stale + ".";
              }
              const body = [
                summary,
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
              if (degraded && !failedBuild && !failedPublish) {
                core.setFailed("Published with stale sources: " + stale);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "A later refresh finished without error. Closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
